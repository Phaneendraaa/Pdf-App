name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk PdfKit.apk

      - name: Build Play Store bundle (only when the upload key secrets are set)
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "No upload key secrets yet; skipping the .aab"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          set -o pipefail
          UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks" PLAY_BUNDLE=1 ./gradlew --no-daemon bundleRelease 2>&1 | tee -a build.log
          cp app/build/outputs/bundle/release/app-release.aab PdfKit.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface compiler errors as annotations (readable without log access).
          grep -E "^e: |error:|FAILURE|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pdf Kit build ${{ github.run_number }}
          body: |
            **Build ${{ github.run_number }}** (version 0.1.${{ github.run_number }}) from commit ${{ github.sha }}.
            Download **PdfKit.apk** below and install it on your phone.
            Check Settings > About Pdf Kit in the app: it should show version 0.1.${{ github.run_number }}.
          files: |
            PdfKit.apk
            PdfKit.aab
          make_latest: true

      - name: Remove older builds
        # Keep only the newest release so the download page never shows an old APK.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^build-' | grep -vx "build-${{ github.run_number }}" \
            | while read -r tag; do gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag; done
