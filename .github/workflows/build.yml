name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk PdfKit.apk

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface compiler errors as annotations (readable without log access).
          grep -E "^e: |error:|FAILURE|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pdf Kit build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.
            Download **PdfKit.apk** below and install it on your phone.
          files: PdfKit.apk
          make_latest: true
